services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qddxp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qddxp:
    build:
      context: ..
      dockerfile: Dockerfile
      target: qddxp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-qddxp}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      WEB_RETURN_URL: ${WEB_RETURN_URL:-http://localhost:8080/delivery}
      ADMIN_KEY: ${ADMIN_KEY:-change-me}
      ORDER_PASSWORD_PEPPER: ${ORDER_PASSWORD_PEPPER:-change-this-in-production}
      RUST_LOG: ${RUST_LOG:-info}
      EPAY_GATEWAY: ${EPAY_GATEWAY:-}
      EPAY_PID: ${EPAY_PID:-}
      EPAY_KEY: ${EPAY_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BIND_PORT:-8080}:3000"

volumes:
  db_data:
