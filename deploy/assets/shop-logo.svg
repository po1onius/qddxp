<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title description">
  <title id="title">卡通荔枝品牌标志</title>
  <desc id="description">一颗带着翠绿叶片、露出开心笑脸的珊瑚红卡通荔枝</desc>

  <!-- 暖白色圆角底板让标志在浅色、深色页面以及浏览器标签栏中都能保持完整轮廓。 -->
  <rect x="4" y="4" width="120" height="120" rx="31" fill="#FFF4ED"/>
  <circle cx="22" cy="34" r="3" fill="#FFC857"/>
  <path d="M105 30V39M100.5 34.5H109.5" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>

  <!-- 枝梗和双叶先置于果实后方，构成清晰、舒展的品牌轮廓。 -->
  <path d="M62.5 42C63.5 31 69 23 78.5 18" stroke="#79533B" stroke-width="5" stroke-linecap="round"/>
  <path d="M67 32C55 32 47 25 45 16C55 15 66 20 72 28C71 30 69 31 67 32Z" fill="#55BC72" stroke="#355C48" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M71 29C77 17 89 13 101 17C97 28 86 35 73 34C71 33 70 31 71 29Z" fill="#39A867" stroke="#355C48" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M51 20C57 23 63 27 68 31" stroke="#E2F5D7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M95 20C87 22 80 26 74 31" stroke="#DDF3D4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 底部投影放在角色后方，使果实站立更稳，同时保留与背景之间的轻盈留白。 -->
  <ellipse cx="64" cy="109.5" rx="25" ry="4.5" fill="#EDCFC4" opacity="0.65"/>

  <!-- 不规则的柔和波浪边缘模拟荔枝果壳，粗深色描边保证缩小后仍易于识别。 -->
  <path d="M63 35C68 32 74 34 77 38C83 36 89 39 91 45C97 46 100 52 98 58C103 62 103 69 99 74C102 80 99 87 93 89C92 96 86 100 80 99C76 105 69 107 63 103C58 107 51 105 48 100C41 101 36 97 35 91C29 88 27 82 30 76C25 72 25 65 29 61C27 54 31 48 37 46C39 39 46 36 52 38C55 34 59 33 63 35Z" fill="#F15B67" stroke="#533B3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 果壳纹理用少量高光与暗红短线概括，兼顾荔枝特征和小尺寸可读性。 -->
  <path d="M43 51L47 49M61 45L64 43M79 49L83 51M36 65L40 66M87 65L92 63M38 82L42 80M83 85L88 87M55 94L57 90M72 94L75 91" stroke="#C93F50" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 42C53 38 60 37 65 39" stroke="#FF9A98" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="51" cy="59" r="2.5" fill="#FF8A8E"/>
  <circle cx="75" cy="57" r="2.5" fill="#FF8A8E"/>
  <circle cx="63" cy="85" r="2.5" fill="#D94455"/>

  <!-- 大眼睛、腮红和上扬嘴角赋予角色亲切活泼的品牌性格。 -->
  <ellipse cx="51.5" cy="69" rx="4.5" ry="5.5" fill="#402E32"/>
  <ellipse cx="75.5" cy="69" rx="4.5" ry="5.5" fill="#402E32"/>
  <circle cx="53" cy="67" r="1.6" fill="white"/>
  <circle cx="77" cy="67" r="1.6" fill="white"/>
  <ellipse cx="42.5" cy="79" rx="6" ry="3.5" fill="#FF9CA5" opacity="0.9"/>
  <ellipse cx="84.5" cy="79" rx="6" ry="3.5" fill="#FF9CA5" opacity="0.9"/>
  <path d="M55 78C57.5 82 60.5 84 63.5 84C67 84 70 82 72 78" stroke="#53313A" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M61 84C62.5 86 65 86 66.5 84" stroke="#FFF4ED" stroke-width="2" stroke-linecap="round"/>

</svg>
