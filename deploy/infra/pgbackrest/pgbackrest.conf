[global]
# 仓库使用 Compose 命名卷提供的 POSIX 文件系统；当前不启用仓库加密。
repo1-type=posix
repo1-path=/backrestrepo
repo1-cipher-type=none

# 保留最近四个周度 full；相关 diff 及恢复所需 WAL 会随备份链一起保留和过期。
# 若业务需要更长恢复窗口，应结合仓库容量调整此值。
repo1-retention-full=4

# zstd 是 pgBackRest 原生支持的成熟压缩实现，在恢复速度与仓库占用之间较均衡。
compress-type=zst
compress-level=3
process-max=2
start-fast=y

# 日志写到容器标准输出，由 Compose 统一采集，避免只保存在容器可写层中。
log-level-console=info
log-level-file=off

# archive-push 与 backup 位于不同容器，必须通过共享卷协调命令锁；恢复容器使用
# 自己的临时 /pgdata，不会和已经停止的在线备份任务争用锁。
lock-path=/pgdata/pgbackrest-lock

[qddxp]
# 数据库与备份容器挂载相同的数据卷和 Socket 卷。备份容器只读访问数据文件，
# 控制查询通过 Unix Socket 完成，因此 pgBackRest 配置中不保存数据库密码。
pg1-path=/data/db/18/docker
pg1-socket-path=/var/run/postgresql
# Compose 通过 PGBACKREST_PG1_USER 覆盖此默认值，以支持自定义 POSTGRES_USER。
pg1-user=postgres
