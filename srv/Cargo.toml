[package]
name = "qddxp-srv"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["chrono", "serde_json", "uuid", "postgres"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
dashmap = "6.2.1"
hex = "0.4"
hmac = "0.12"
ipnet = "2.12.1"
md5 = "0.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
roxmltree = "0.21.1"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
teloxide-core = { version = "0.13.0", default-features = false, features = ["rustls"] }
time = "0.3.55"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
tower-sessions-moka-store = "0.15.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
